spring:
  application:
    name: ludotech

  datasource:
    url: jdbc:postgresql://localhost:5432/ludotech
#    username: postgres
    username: devuser
#    password: postgres
    password: devuser
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:db/changelog-master.yml
    enabled: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  error:
    include-message: always
